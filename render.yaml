services:
  - type: web
    name: eventpilot-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: "EventPilot AI"
      - key: HOST
        value: "0.0.0.0"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "1.0"
      # AI Inference Settings for Render deployment:
      # Options: 'demo' for instant zero-dependency testing, or 'openai_compatible' with hosted Gemma (Groq / Together / OpenRouter)
      - key: AI_PROVIDER
        value: demo
      - key: GEMMA_MODEL
        value: "gemma2-9b-it"
      - key: INFERENCE_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: INFERENCE_API_KEY
        sync: false # Set via Render dashboard secret
      - key: SENTRY_DSN
        sync: false # Set via Render dashboard secret
